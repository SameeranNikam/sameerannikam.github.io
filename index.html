<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name | Portfolio</title>
<meta name="description" content="Portfolio of Your Name: experience, projects, skills and achievements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#16202e; --muted:#5a6676; --line:#dde1e7;
  --accent:#4a3aa8; --accent-soft:#ecebf8; --gold:#dcab63;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f151d;--surface:#161e29;--ink:#e8ecf1;--muted:#9aa5b4;--line:#27323f;--accent:#b7a9ff;--accent-soft:#241f45}
}
:root[data-theme="dark"]{--bg:#0f151d;--surface:#161e29;--ink:#e8ecf1;--muted:#9aa5b4;--line:#27323f;--accent:#b7a9ff;--accent-soft:#241f45}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.layout{max-width:1120px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:300px 1fr;gap:72px}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:clamp(72px,14vh,140px) 24px clamp(64px,11vh,110px);
  background:
   repeating-linear-gradient(118deg,transparent 0 90px,rgba(255,255,255,.035) 90px 150px,transparent 150px 260px),
   linear-gradient(135deg,#5a1089 0%,#33107f 48%,#17128f 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.hero-inner{position:relative;max-width:860px;margin:0 auto;animation:rise .9s ease-out both}
.hero h1{font:700 clamp(2.4rem,6vw,4.2rem)/1.1 var(--serif);color:var(--gold);margin:0 0 18px;letter-spacing:-.015em}
.hero .sub-h{font:500 clamp(1.15rem,2.6vw,1.6rem)/1.4 var(--serif);color:#f0dcb8;margin:0 0 34px}
.facts-line{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 0;list-style:none;margin:0 0 38px;padding:0;font-size:1rem;color:#e6e3f7}
.facts-line li{padding:0 20px}
.facts-line li+li{border-left:1px solid rgba(255,255,255,.3)}
.hero-cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.hero-cta a{padding:11px 24px;border-radius:6px;font-weight:600;font-size:.95rem;text-decoration:none;border:1px solid var(--gold)}
.hero-cta .solid{background:var(--gold);color:#241446}
.hero-cta .ghost{color:var(--gold)}
.hero-cta a:hover{opacity:.88}
.hero a:focus-visible{outline-color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-inner{animation:none}}
@media (max-width:560px){.facts-line li{border:0!important;padding:0 12px}}
/* about */
.about{display:grid;grid-template-columns:210px 1fr;gap:36px;align-items:start}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:block}
.photo-ph{display:flex;align-items:center;justify-content:center;font:600 3rem var(--serif);color:var(--accent);background:var(--accent-soft)}
.facts{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-size:.95rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
@media (max-width:640px){.about{grid-template-columns:1fr}.photo{max-width:200px}}
/* sidebar */
aside{position:sticky;top:0;align-self:start;height:100vh;padding:64px 0 40px;display:flex;flex-direction:column}
aside h1{font:700 2.1rem/1.15 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
.role{font-size:1.05rem;font-weight:500;color:var(--accent);margin:0 0 14px}
.tagline{color:var(--muted);margin:0 0 28px;font-size:.95rem;max-width:30ch}
nav ul{list-style:none;margin:0 0 auto;padding:0;border-left:1px solid var(--line)}
nav a{display:block;padding:7px 0 7px 18px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--ink)}
nav a.active{color:var(--ink);border-left-color:var(--accent);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.links a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:500}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.links svg{width:16px;height:16px;fill:currentColor}
.links a.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.links a.primary:hover{color:var(--bg);opacity:.9}
#theme{margin-top:18px;align-self:flex-start;background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
/* main */
main{padding:64px 0 40px}
section{padding-bottom:64px}
h2{font:600 1.55rem/1.2 var(--serif);margin:0 0 28px;padding-bottom:12px;border-bottom:1px solid var(--line)}
h3{font:600 1.1rem/1.35 var(--sans);margin:0}
p{margin:0 0 12px}
.muted{color:var(--muted)}
#about p{max-width:68ch}
/* timeline */
.sub{font-size:.8rem;color:var(--muted);margin:30px 0 14px;font-weight:600;letter-spacing:.02em}
.sub:first-of-type{margin-top:0}
.tl{border-left:2px solid var(--line);margin-left:5px;padding-left:26px}
.job{position:relative;padding-bottom:30px}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;left:-33px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.job-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px}
.job .org{color:var(--accent);font-weight:500}
.job .date{color:var(--muted);font-size:.9rem;white-space:nowrap}
.job ul{margin:10px 0 0;padding-left:18px}
.job li{margin-bottom:5px;max-width:68ch}
/* projects */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 26px;margin-bottom:18px}
.proj:last-child{margin-bottom:0}
.proj-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.proj-links{display:flex;gap:16px;font-size:.9rem;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.tags li{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 10px;font-size:.82rem;font-weight:500}
/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px 32px}
.skills h3{font-size:.95rem;margin-bottom:10px}
.skills ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.skills li{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:2px 10px;font-size:.88rem}
/* extras */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:36px}
.two h3{margin-bottom:14px}
.two ul{margin:0;padding:0;list-style:none}
.two li{padding:0 0 14px 16px;border-left:2px solid var(--line);margin-bottom:14px}
.two li:last-child{margin-bottom:0}
.two b{display:block;font-weight:600}
.two span{color:var(--muted);font-size:.92rem}
footer{border-top:1px solid var(--line);padding:24px 0 48px;color:var(--muted);font-size:.88rem}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:0}
  aside{position:static;height:auto;padding:44px 0 8px}
  nav{display:none}
  main{padding-top:32px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{aside nav,#theme{display:none}aside{position:static;height:auto}.layout{display:block}}
</style>
</head>
<body>
<header class="hero" id="top">
  <div class="hero-inner">
    <h1 id="hero-title"></h1>
    <p class="sub-h" id="hero-sub"></p>
    <ul class="facts-line" id="hero-facts"></ul>
    <div class="hero-cta" id="hero-cta"></div>
  </div>
</header>
<div class="layout">
  <aside>
    <div>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
    </div>
    <nav aria-label="Sections">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#extras">Activities and achievements</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="links" id="links"></div>
    <button id="theme" type="button">Switch theme</button>
  </aside>

  <main>
    <section id="about"><h2>About</h2><div id="about-body"></div></section>
    <section id="experience"><h2>Experience</h2><div id="exp-body"></div></section>
    <section id="projects"><h2>Selected projects</h2><div id="proj-body"></div></section>
    <section id="skills"><h2>Skills</h2><div class="skills" id="skills-body"></div></section>
    <section id="extras"><h2>Activities and achievements</h2><div class="two" id="extras-body"></div></section>
    <section id="contact"><h2>Contact</h2><div id="contact-body"></div></section>
    <footer id="footer"></footer>
  </main>
</div>

<script>
/* =====================================================================
   EDIT THIS BLOCK ONLY. Replace every placeholder with your own details.
   To add an item, copy an existing { ... } block. To remove one, delete it.
   Leave a link as "" to hide that button.
   ===================================================================== */
const CONFIG = {
  name: "Sameeran Nikam",
  role: "Software Development Engineer",                       // shown under your name in the sidebar
  tagline: "I love to tackle software problems and score goals with code and football.",   // shown under your role in the sidebar

  // Landing banner
  hero: {
    subline: "Fueled by code and curiosity",
    highlights: ["🎓 B.Tech, IIT Guwahati", "💻 Software Development Engineer", "🎌 Anime and Football ⚽"]   // 2 to 4 short items
  },

  photo: "assets/images/photo.png",   // put your photo at this path in the repo; leave "" to show your initials

  facts: [   // small details shown under your About text; add or remove freely
    { label: "Education", value: "B.Tech - IIT Guwahati (2023-2027) " },
    { label: "Focus",     value: "Software Development, Artificial Intelligence" },
    { label: "Location",  value: "Nashik - India | Tokyo - Japan" },
    { label: "Interests", value: "Anime, Football, Fiction novels" }
  ],

  links: {
    github:   "https://github.com/sameerannikam/",
    linkedin: "https://www.linkedin.com/in/sameerannikam/",
    email:    "sameeranofficial17@gmail.com",
    resume:   "assets/documents/resume.pdf"   // upload your PDF to the repo root with this exact name
  },

  about: [
"Hi, I'm Sameeran Nikam — a final year B.Tech student at IIT Guwahati, passionate about building smart, user-centric software solutions. I love combining  Software Development with Artificial Intelligence, to create innovative tools that solve real-world problems.",
" Beyond academics and coding, I'm an enthusiastic reader of fiction and thriller novels, and you'll often find me enjoying an interesting anime or a good football match."
  ],

  fullTime: [
    // {
    //   title: "Job Title",
    //   company: "Company Name",
    //   location: "City, Country",
    //   dates: "Mon YYYY to Present",
    //   points: [
    //     "Led or built something specific. Describe the action, the scale and the measurable result.",
    //     "Second achievement, for example reduced latency by 30% or shipped a feature used by 10,000 users.",
    //     "Third achievement or responsibility."
    //   ]
    // }
  ],

  internships: [
    {
      title: "AI Network Intern",
      company: "NTT-AT",
      location: "Tokyo, Japan",
      dates: "May 2026 to July 2026",
      points: [
        "Engineered a tool-augmented conversational AI agent using Granite4.1:8b model and the Model Context Protocol (MCP) that autonomously diagnoses network issues, replacing reactive dashboard monitoring with proactive, natural-language troubleshooting.",
        "Architected an end-to-end data pipeline that splits raw PCAP files, converts them to structured logs via Zeek, and ingests them into OpenSearch through Fluentbit, enabling packet-level, unaggregated queries.",
        "Designed domain-specific knowledge files and detection criteria for Denial-of-Service, Brute-Force, and Port-Scan attacks, enabling the agent to retrieve log evidence, identify root causes, and generate actionable countermeasures.",
        "Optimized agent accuracy through prompt engineering and hyperparameter tuning, and evaluated the system architecture and agent accuracy using the CIC-IDS-2017 dataset."
      ]
    },
    // {
    //   title: "Intern Role Title",
    //   company: "Company Name",
    //   location: "City, Country",
    //   dates: "Mon YYYY to Mon YYYY",
    //   points: [
    //     "What you worked on and the technologies you used.",
    //     "The outcome or impact of your contribution."
    //   ]
    // }
  ],

  projects: [   // your top 3
    {
      name: "Project One",
      description: "Two sentences: the problem it solves, your role and the result.",
      tech: ["Tech A", "Tech B", "Tech C"],
      github: "https://github.com/your-username/project-one",
      demo: ""   // live link, or "" to hide
    },
    {
      name: "Project Two",
      description: "Two sentences: the problem it solves, your role and the result.",
      tech: ["Tech A", "Tech B", "Tech C"],
      github: "https://github.com/your-username/project-two",
      demo: ""
    },
    {
      name: "Project Three",
      description: "Two sentences: the problem it solves, your role and the result.",
      tech: ["Tech A", "Tech B", "Tech C"],
      github: "https://github.com/your-username/project-three",
      demo: ""
    }
  ],

  skills: {     // rename groups freely
    "Languages":        ["Language 1", "Language 2", "Language 3"],
    "Frameworks":       ["Framework 1", "Framework 2"],
    "Tools and cloud":  ["Git", "Docker", "Tool 3"],
    "Core concepts":    ["Concept 1", "Concept 2", "Concept 3"]
  },

  activities: [
    { title: "Role or activity", detail: "Club, society or organisation, with dates." },
    { title: "Role or activity", detail: "Club, society or organisation, with dates." }
  ],

  achievements: [
    { title: "Award, rank or certification", detail: "Issuer or event, year." },
    { title: "Award, rank or certification", detail: "Issuer or event, year." }
  ]
};
/* ===================== end of editable block ===================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = CONFIG.links;

document.title = CONFIG.name + " | Portfolio";
$("name").textContent = CONFIG.name;
$("role").textContent = CONFIG.role;
$("tagline").textContent = CONFIG.tagline;

const icons = {
  github:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>',
  linkedin:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5.500h3V15H1zM2.500 1a1.700 1.700 0 1 1 0 3.400 1.700 1.700 0 0 1 0-3.400zM6 5.500h2.900v1.300c.4-.8 1.400-1.500 2.900-1.500 3 0 3.600 2 3.600 4.600V15h-3v-4.500c0-1.100 0-2.500-1.500-2.500S9 9.200 9 10.400V15H6z"/></svg>',
  email:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 3h14v10H1zm1.500 1.300L8 8.600l5.500-4.300V4.500L8 8.800 2.500 4.500z" fill-rule="evenodd"/></svg>',
  resume:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1h7l3 3v11H3zm6.500 1v3h3zM5 8h6v1H5zm0 2.500h6v1H5z" fill-rule="evenodd"/></svg>'
};
const linkBtn = (href, label, key, cls="") =>
  href ? `<a class="${cls}" href="${esc(href)}" ${key==="email"?"":'target="_blank" rel="noopener"'}>${icons[key]}${label}</a>` : "";

$("links").innerHTML =
  linkBtn(L.resume, "Resume", "resume", "primary") +
  linkBtn(L.github, "GitHub", "github") +
  linkBtn(L.linkedin, "LinkedIn", "linkedin") +
  linkBtn(L.email && "mailto:" + L.email, "Email", "email");

const initials = CONFIG.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const ph = `<div class="photo photo-ph" role="img" aria-label="Profile photo placeholder">${esc(initials)}</div>`;
$("about-body").innerHTML = `<div class="about">
  ${CONFIG.photo ? `<img class="photo" src="${esc(CONFIG.photo)}" alt="Portrait of ${esc(CONFIG.name)}">` : ph}
  <div>${CONFIG.about.map(p => `<p>${esc(p)}</p>`).join("")}
  <dl class="facts">${CONFIG.facts.map(f => `<dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd>`).join("")}</dl></div></div>`;
const img = document.querySelector("#about-body img.photo");
if (img) img.addEventListener("error", () => img.replaceWith(Object.assign(document.createElement("div"), {className: "photo photo-ph", textContent: initials})));

$("hero-title").textContent = CONFIG.name;
$("hero-sub").textContent = CONFIG.hero.subline;
$("hero-facts").innerHTML = CONFIG.hero.highlights.map(h => `<li>${esc(h)}</li>`).join("");
$("hero-cta").innerHTML = `<a class="ghost" href="#projects">View projects</a>` +
  (L.resume ? `<a class="solid" href="${esc(L.resume)}" target="_blank" rel="noopener">Resume</a>` : "") +
  `<a class="ghost" href="#contact">Get in touch</a>`;

const job = j => `<article class="job">
  <div class="job-head"><h3>${esc(j.title)}</h3><span class="date">${esc(j.dates)}</span></div>
  <div class="org">${esc(j.company)}${j.location ? " , " + esc(j.location) : ""}</div>
  <ul>${j.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></article>`;
const group = (label, list) => list.length
  ? `<p class="sub">${label}</p><div class="tl">${list.map(job).join("")}</div>` : "";
$("exp-body").innerHTML = group("Full-time", CONFIG.fullTime) + group("Internships", CONFIG.internships);

$("proj-body").innerHTML = CONFIG.projects.slice(0, 3).map(p => `<article class="proj">
  <div class="proj-head"><h3>${esc(p.name)}</h3><div class="proj-links">
    ${p.github ? `<a href="${esc(p.github)}" target="_blank" rel="noopener">Source code</a>` : ""}
    ${p.demo ? `<a href="${esc(p.demo)}" target="_blank" rel="noopener">Live demo</a>` : ""}</div></div>
  <p class="muted">${esc(p.description)}</p>
  <ul class="tags">${p.tech.map(t => `<li>${esc(t)}</li>`).join("")}</ul></article>`).join("");

$("skills-body").innerHTML = Object.entries(CONFIG.skills).map(([g, items]) =>
  `<div><h3>${esc(g)}</h3><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");

const list = (title, items) => `<div><h3>${title}</h3><ul>${items.map(i =>
  `<li><b>${esc(i.title)}</b><span>${esc(i.detail)}</span></li>`).join("")}</ul></div>`;
$("extras-body").innerHTML = list("Extra-curricular activities", CONFIG.activities) + list("Achievements", CONFIG.achievements);

$("contact-body").innerHTML = `<p class="muted" style="max-width:60ch">I am open to new opportunities and conversations. You can contact me here.</p>
  <div class="links" style="margin-top:16px">${linkBtn(L.email && "mailto:" + L.email, "Email", "email")}${linkBtn(L.resume, "Resume", "resume")}${linkBtn(L.linkedin, "LinkedIn", "linkedin")}${linkBtn(L.github, "GitHub", "github")}</div>`;
$("footer").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;

/* active nav link */
const navLinks = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
}), {rootMargin: "-30% 0px -60% 0px"});
document.querySelectorAll("main section").forEach(s => io.observe(s));

/* theme toggle */
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
